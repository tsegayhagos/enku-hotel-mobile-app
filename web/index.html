<!DOCTYPE html>
<html lang="am">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1.00001, viewport-fit=cover" />
    <title>Enku Hotel & Suites — Luxury Mobile Experience</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

    <style>
      /* CSS Reset & Ambient Theme */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        background: radial-gradient(circle at 50% 10%, #17243b 0%, #080d16 55%, #03060a 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
      }

      /* Desktop: Ultra-luxury Smartphone Preview Frame */
      @media (min-width: 600px) {
        #root {
          max-width: 430px !important;
          height: 900px !important;
          border-radius: 52px !important;
          border: 10px solid #202b3d !important;
          box-shadow: 
            0 30px 80px -15px rgba(0, 0, 0, 0.9), 
            0 0 50px rgba(14, 165, 164, 0.2),
            inset 0 0 0 2px rgba(255, 255, 255, 0.1) !important;
          overflow: hidden !important;
          margin: 30px auto !important;
          position: relative !important;
          background-color: #070B11 !important;
        }
      }

      @media (max-width: 599px) {
        #root {
          width: 100% !important;
          height: 100vh !important;
          background-color: #070B11 !important;
        }
      }

      /* Luxury Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(212, 175, 55, 0.25);
        border-radius: 6px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(212, 175, 55, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
